name: Mirror to Azure DevOps

on: [push]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Azure DevOps
        run: |
          git push --mirror https://x:${{ secrets.AZURE_DEVOPS_TOKEN }}@dev.azure.com/UniNexusco/UniNexus/_git/uninexus-backend
